<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="School CRM payment-workflow"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#3b62c9" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1440" height="1000" rx="16" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/><text x="48" y="66" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#17253c">School CRM / recording a tuition payment</text><text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">Database accounting: a staff member records money received outside the application.</text><text x="48" y="188" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#3b62c9">01</text><rect x="48" y="210" width="414" height="139" rx="16" fill="#eff6ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="68" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Validate the entry</text><text x="68" y="282" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Authenticated Manager or Owner</text><text x="68" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Student, amount, date and method</text><text x="68" y="338" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Explicit allocation to open charges</text><text x="513" y="188" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#3b62c9">02</text><rect x="513" y="210" width="414" height="139" rx="16" fill="#eff6ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="533" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Commit the ledger</text><text x="533" y="282" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Lock the student row</text><text x="533" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Check idempotency and balances</text><text x="533" y="338" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Save payment + allocations + outbox</text><text x="978" y="188" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#3b62c9">03</text><rect x="978" y="210" width="414" height="139" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="998" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Deliver asynchronously</text><text x="998" y="282" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Worker claims the outbox event</text><text x="998" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Telegram request outside the commit</text><text x="998" y="338" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Delivery status and retry schedule</text><rect x="48" y="400" width="1344" height="110" rx="16" fill="#ecfdf5" stroke="#86c9b0" stroke-width="1.5"/><text x="72" y="440" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#047857">Example: 2,000,000 UZS recorded</text><text x="72" y="480" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#047857">1,500,000 allocated to tuition → 500,000 remains as advance credit.</text><text x="48" y="581" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#17253c">Mistakes have an explicit approval path</text><rect x="48" y="617" width="414" height="111" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="657" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Manager requests a correction</text><text x="68" y="689" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Proposed values + reason</text><text x="68" y="717" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Original values remain reviewable</text><rect x="513" y="617" width="414" height="111" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="533" y="657" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Owner decides</text><text x="533" y="689" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Approve or reject the request</text><text x="533" y="717" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Recheck the current payment state</text><rect x="978" y="617" width="414" height="111" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="998" y="657" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Record the outcome</text><text x="998" y="689" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Apply an approved change</text><text x="998" y="717" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Audit before / after + decision</text><rect x="48" y="798" width="1344" height="150" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="842" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Failure boundaries</text><text x="72" y="879" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#17253c">A repeated submission reuses its payment. A Telegram outage does not roll back the ledger.</text><text x="72" y="914" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#17253c">Audit events are written by services; the payment transaction specifically includes the outbox.</text><path d="M467,280 L503,280" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M932,280 L968,280" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M467,670 L503,670" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M932,670 L968,670" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/></svg>