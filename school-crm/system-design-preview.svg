<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-label="School CRM system-design"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#3b62c9" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1440" height="1120" rx="16" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/><text x="48" y="66" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#17253c">School CRM / system architecture</text><text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">A modular application with a transactional ledger and asynchronous notifications.</text><rect x="48" y="145" width="390" height="111" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="68" y="185" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Manager</text><text x="68" y="217" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Students, tuition entries, allocations</text><text x="68" y="245" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Corrections requested for review</text><rect x="485" y="145" width="390" height="111" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="505" y="185" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Owner</text><text x="505" y="217" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Oversight, tariffs, correction decisions</text><text x="505" y="245" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Debtors, statistics and audit</text><rect x="922" y="145" width="470" height="111" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="942" y="185" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Scheduled jobs</text><text x="942" y="217" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Monthly charges + daily report</text><text x="942" y="245" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Separate scripts; shared domain services</text><path d="M899,238 L899,574" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="none"/><rect x="48" y="315" width="827" height="400" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="72" y="354" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1d4ed8">APPLICATION  /  Next.js + React + TypeScript</text><rect x="72" y="381" width="779" height="111" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="92" y="421" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Web workspace</text><text x="92" y="453" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Ant Design · Uzbek / Russian · desktop operations</text><text x="92" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Server-rendered pages and interactive forms</text><rect x="72" y="521" width="779" height="111" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="92" y="561" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Server actions → domain services</text><text x="92" y="593" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Session + role checks · input validation · financial rules</text><text x="92" y="621" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Repository boundary · Drizzle queries and transactions</text><rect x="922" y="380" width="470" height="139" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="942" y="420" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Transaction boundary</text><text x="942" y="452" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Payment + allocations + outbox</text><text x="942" y="480" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Commit together before delivery</text><text x="942" y="508" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Audit is recorded by the service</text><rect x="922" y="740" width="470" height="111" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="942" y="780" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Background worker</text><text x="942" y="812" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Claims pending outbox messages</text><text x="942" y="840" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Retries failures; records delivery state</text><rect x="922" y="917" width="470" height="111" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="942" y="957" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Telegram Bot API</text><text x="942" y="989" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Staff group notifications + daily report</text><text x="942" y="1017" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Owner alert for approved amount changes</text><rect x="48" y="766" width="827" height="305" rx="16" fill="#ecfdf5" stroke="#86c9b0" stroke-width="1.5"/><text x="72" y="804" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#047857">POSTGRESQL  /  authoritative records</text><rect x="72" y="834" width="375" height="111" rx="16" fill="#ffffff" stroke="#86c9b0" stroke-width="1.5"/><text x="92" y="874" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Financial ledger</text><text x="92" y="906" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Students + tariff history</text><text x="92" y="934" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Charges ↔ allocations ↔ payments</text><rect x="472" y="834" width="375" height="111" rx="16" fill="#ffffff" stroke="#86c9b0" stroke-width="1.5"/><text x="492" y="874" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Controls and delivery</text><text x="492" y="906" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Correction requests · audit log</text><text x="492" y="934" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Outbox messages · sessions</text><text x="72" y="1000" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#047857">Row locks + unique keys + database constraints</text><text x="72" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#047857">Audit UPDATE / DELETE blocked by a database trigger</text><text x="479" y="736" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1d4ed8">read / write</text><text x="877" y="797" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a16207">poll</text><path d="M243,256 L243,315" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M680,256 L680,315" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M922,238 L899,238" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M899,574 L861,574" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460,492 L460,521" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1157,851 L1157,908" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460,638 L460,756" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M875,810 L912,810" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/></svg>