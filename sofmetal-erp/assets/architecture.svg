<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 764" role="img" aria-labelledby="sofmetal-architecture-title sofmetal-architecture-desc">
<title id="sofmetal-architecture-title">Sofmetal ERP architecture</title>
<desc id="sofmetal-architecture-desc">React workspaces call the Django REST API, which applies deal rules, stores records and files, and can queue notification tasks through Redis and Celery.</desc>
