<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="Tender ERP deal-workflow"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#3b62c9" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1440" height="1000" rx="16" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/><text x="48" y="66" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#17253c">Tender ERP / deadlines and deal lifecycle</text><text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">A representative operating flow; payment, process and deal status are separate fields.</text><rect x="48" y="165" width="410" height="111" rx="16" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="68" y="205" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">1. Register the opportunity</text><text x="68" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Client, company, manager and broker</text><text x="68" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Lot reference + line items + dates</text><rect x="510" y="165" width="410" height="111" rx="16" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="530" y="205" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">2. Track the active auction</text><text x="530" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Central list and deal detail</text><text x="530" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Deadline context visible to staff</text><rect x="972" y="165" width="420" height="111" rx="16" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="205" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">3. Await payment</text><text x="992" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Expired active auction moves here</text><text x="992" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Recorded status, not a bank transfer</text><rect x="48" y="347" width="1344" height="148" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="72" y="390" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#a16207">TIME-DRIVEN FOLLOW-UP</text><text x="72" y="430" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#17253c">Scheduled tasks check deadlines and prepare reminders / digests for Telegram.</text><text x="72" y="467" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#17253c">The API also reconciles expired active auctions when records are accessed.</text><rect x="48" y="565" width="410" height="111" rx="16" fill="#ecfdf5" stroke="#86c9b0" stroke-width="1.5"/><text x="68" y="605" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Record payment status</text><text x="68" y="637" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Staff mark the deal as paid</text><text x="68" y="665" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Commercial records stay attached</text><rect x="510" y="565" width="410" height="111" rx="16" fill="#ecfdf5" stroke="#86c9b0" stroke-width="1.5"/><text x="530" y="605" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Complete the deal</text><text x="530" y="637" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Completion allowed from paid</text><text x="530" y="665" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">or waiting_payment</text><rect x="972" y="565" width="420" height="111" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="992" y="605" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#17253c">Handle cancellation</text><text x="992" y="637" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Request / termination states</text><text x="992" y="665" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Manager cancellation needs a reason</text><rect x="48" y="775" width="1344" height="170" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="821" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#17253c">Controls throughout the workflow</text><text x="72" y="861" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#17253c">Role checks • manual locking • six-hour manager edit window after closing</text><text x="72" y="900" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#17253c">Audit captures who changed the record and its before / after values.</text><path d="M458,223 L500,223" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M920,223 L962,223" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M458,620 L500,620" stroke="#3b62c9" stroke-width="2" fill="none" marker-end="url(#a)"/></svg>